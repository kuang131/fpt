name: Actualizar Agenda Automáticamente

on:
  schedule:
    - cron: '0 * * * *' # Corre cada 1 hora
  workflow_dispatch: # Permite probar a mano

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar librerías de scraping
      run: pip install beautifulsoup4 requests

    - name: Ejecutar el Scraper para armar el HTML
      run: python fpt.py

    - name: Desplegar directamente a Netlify (Oficial)
      uses: netlify/actions/cli@master
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      with:
        args: deploy --dir=. --prod

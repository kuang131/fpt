name: Actualizar Agenda Automáticamente

on:
  schedule:
    - cron: '0 * * * *' # Corre cada 1 hora en punto
  workflow_dispatch: # Nos permite ejecutarlo a mano para probar

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Le dice a Git que mantenga las credenciales vivas

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar librerías de scraping
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests

    - name: Ejecutar el Scraper
      run: python fpt.py

    - name: Subir cambios al repositorio si varió el JSON
      env:
        # Cargamos el token de seguridad por defecto en una variable de entorno
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add agenda.json
        
        # Si no hay cambios, no hace nada. Si hay cambios, commitea y empuja usando el token explícito
        git diff --quiet && git diff --staged --quiet || (git commit -m "Agenda actualizada automáticamente" && git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }})

name: Actualizar Agenda Automáticamente

on:
  schedule:
    - cron: '0 * * * *' # Corre cada 1 hora en punto
  workflow_dispatch: # Te permite ejecutarlo a mano para probar

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    # AQUÍ ESTÁ LA SOLUCIÓN: Forzamos los permisos de escritura en el repositorio
    permissions:
      contents: write

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar librerías de scraping
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests

    - name: Ejecutar el Scraper
      run: python fpt.py

    - name: Subir cambios al repositorio si varió el JSON
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add agenda.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Agenda actualizada automáticamente" && git push)
